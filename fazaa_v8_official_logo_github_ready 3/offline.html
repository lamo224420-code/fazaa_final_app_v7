<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#312e81"><title>فزعة — لا يوجد اتصال</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,#4338ca,#0f172a 62%);font-family:Tahoma,Arial,sans-serif;color:#fff;padding:22px}.card{width:min(430px,100%);text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);border-radius:26px;padding:30px}.icon{width:88px;height:88px;border-radius:24px;margin:auto;background:#fff;display:grid;place-items:center;color:#4338ca;font-weight:900;font-size:48px}.muted{opacity:.72;line-height:1.8}.btn{margin-top:15px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;color:#312e81;background:#fff}</style></head><body><div class="card"><div class="icon">ف</div><h1>تطبيق فزعة</h1><p class="muted">لا يوجد اتصال بالإنترنت حاليًا. يلزم الاتصال لعرض الطلبات وحفظ البيانات بأمان.</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div></body></html>
